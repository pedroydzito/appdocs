name: unslop-ui

on:
  push:
    paths: ["ferramentas/unslop-ui/**"]
  pull_request:
    paths: ["ferramentas/unslop-ui/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferramentas/unslop-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
